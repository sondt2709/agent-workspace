# Checks of the packages in plugins/. The root "task check" calls "task plugins:check".
# pnpm reads a --filter path from the workspace root, not from this folder.
version: "3"

tasks:
  check:
    desc: Check the packages in plugins/ (format, lint, typecheck, tests)
    cmds:
      - pnpm --filter "./plugins/*" run format:check
      - pnpm --filter "./plugins/*" run lint
      - pnpm --filter "./plugins/*" run typecheck
      - pnpm --filter "./plugins/*" --workspace-concurrency=1 run test
