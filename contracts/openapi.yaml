        with a change"
      description: 'Messages are JSON text: `{"type":"hello","version"}`,
        `{"type":"changed","workspace","tasks","workspace_changed","documents_changed","full"}`,
        `{"type":"notice","workspace","notices"}`. After a reconnect, load the
        state again.'
      responses:
        "101":
          description: "Switching Protocols: the WebSocket starts"
        "404":
          description: The request is not a WebSocket upgrade
