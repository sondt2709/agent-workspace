                    - type: string
                      minLength: 1
                      maxLength: 100
                    - type: "null"
                read_every_s:
                  type: integer
                  minimum: 15
                  maximum: 3600
                default_read:
                  type: string
                  enum:
                    - all
                    - mentions
                    - off
                conversations:
                  maxItems: 5000
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 200
                      name:
                        type: string
                        minLength: 1
                        maxLength: 200
                      kind:
                        type: string
                        enum:
                          - direct
                          - group
                          - channel
                      read:
                        type: string
                        enum:
                          - all
                          - mentions
                          - off
                      project:
                        anyOf:
                          - type: string
                            maxLength: 63
                            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                          - type: "null"
                    required:
                      - id
                      - name
                      - kind
                      - read
                triage:
                  type: object
                  properties:
                    model:
                      type: string
                      minLength: 1
                      maxLength: 100
                    every_min:
                      type: integer
                      minimum: 1
                      maximum: 1440
                    days:
                      maxItems: 7
                      type: array
                      items:
                        type: integer
                        minimum: 1
                        maximum: 7
                    from:
                      type:
                        - string
                        - "null"
                    to:
                      type:
                        - string
                        - "null"
                    instruction:
                      type: string
                      maxLength: 8000
                    paused:
                      type: boolean
                removed:
                  type: boolean
              required:
                - name
                - server_url
                - credential
                - collector
              additionalProperties: false
