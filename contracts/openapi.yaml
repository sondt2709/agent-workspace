    get:
      operationId: getThread
      summary: The events of the task in merge order (HLC, device, id), in pages
      tags:
        - tasks
      parameters:
        - schema:
            type: string
            minLength: 1
          in: query
          name: after
          required: false
          description: The `next` cursor of the last page
        - schema:
            type: integer
            minimum: 1
            maximum: 1000
          in: query
          name: limit
          required: false
        - schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
          in: query
          name: from
          required: false
          description: The offset of the first event (0 is the first), when `after` is not
            given
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          in: query
          name: ancestors
          required: false
        - schema:
            type: string
            minLength: 1
          in: query
          name: before
          required: false
          description: "The `prev` cursor of a page: the `limit` events just before it"
        - schema:
            type: string
            enum:
              - "true"
              - "false"
          in: query
          name: newest
          required: false
          description: "`true`: the newest `limit` events (still oldest first)"
        - schema:
            type: string
            pattern: ^[a-z_.]+(,[a-z_.]+)*$
          in: query
          name: types
          required: false
          description: Only the events of these types, comma separated, for example
            gate.opened,result.posted
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          in: path
          name: ws
          required: true
          description: The workspace id or name. `-` selects the only workspace.
        - schema:
            type: string
            minLength: 1
            maxLength: 128
          in: path
          name: task
          required: true
          description: The task id, the key (any letter case) or an id prefix of 8+
            characters
