openapi: 3.1.0
info:
  title: awd local API
  description: The local API of awd on the Unix socket `~/.aw/run/awd.sock` (mode
    0600). No TCP port. Generated from the zod schemas of daemon/; do not edit
    by hand (`pnpm api:generate`).
  version: "1"
  license:
    name: MIT
    identifier: MIT
components:
  schemas:
    SessionOptionsInputInput:
      type: object
      properties:
        permission_mode:
          description: "default, accept_edits or skip (no gate for each command); null:
            the project default"
          anyOf:
            - type: string
              enum:
                - default
                - accept_edits
                - skip
            - type: "null"
        agent_teams:
          description: Turn on Claude Code agent teams
          type: boolean
        work_in:
          description: worktree (default), checkout or folder
          type: string
          enum:
            - worktree
            - checkout
            - folder
        folder:
          description: The absolute folder on the session device; only with work_in folder
          anyOf:
            - type: string
              maxLength: 4096
              pattern: ^\/
            - type: "null"
        switch_branch:
          description: "With work_in checkout: true (default) checks out aw/<key>; false
            keeps the branch"
          type: boolean
    EditWorkspaceInputInput:
      type: object
      properties:
        name:
          description: The name in tasks/workspace.yaml
          type: string
          minLength: 1
          maxLength: 200
        new_project_permission_mode:
          description: The permission mode of new projects; skip counts only for tasks of
            a person
          type: string
          enum:
            - default
            - accept_edits
            - skip
    EditProjectInputInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        devices:
          description: The implementing devices in priority order
          maxItems: 100
          type: array
          items:
            type: string
            maxLength: 63
            pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        default_agent:
          type: string
          pattern: ^[a-z][a-z0-9-]*$
        links:
          maxItems: 100
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 2000
        main_repo:
          description: The main repository. awd adds it to the front of `links` when it is
            missing.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: "null"
        test_servers:
          maxItems: 100
          type: array
          items:
            type: string
            maxLength: 63
            pattern: ^[a-z0-9]+(?:[-_.][a-z0-9]+)*$
        switches:
          type: object
          properties:
            assign_new_subtasks_to_default_device:
              type: boolean
        archived:
          description: An archived project gets no new tasks
          type: boolean
        permission_mode:
          description: The permission mode of new sessions; skip counts only for tasks of
            a person
          type: string
          enum:
            - default
            - accept_edits
            - skip
    EditBindingsInputInput:
      type: object
      properties:
        use_orca:
          description: Use Orca on this device
          type: boolean
        resources:
          description: The full map of the test slot resources and their capacity
          type: object
          propertyNames:
            type: string
            maxLength: 63
            pattern: ^[a-z0-9]+(?:[-_.][a-z0-9]+)*$
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 1000
        checkouts:
          maxItems: 200
          type: array
          items:
            type: object
            properties:
              project:
                type: string
                maxLength: 63
                pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
              path:
                anyOf:
                  - type: string
                    minLength: 1
                    maxLength: 4096
                  - type: "null"
                description: The absolute folder of the checkout; null removes the checkout
              session_host:
                description: "Not set: keep the host of the old entry; null: the default host"
                anyOf:
                  - type: string
                    enum:
                      - tmux
                      - orca
                  - type: "null"
            required:
              - project
              - path
    AskReply:
      type: object
      properties:
        gate:
          type: string
        event:
          type: object
          properties:
            id:
              type: string
            hlc:
              type: string
            dev:
              type: string
            type:
              type: string
            data:
              type: object
              propertyNames:
                type: string
              additionalProperties: {}
          required:
            - id
            - hlc
            - dev
            - type
            - data
          additionalProperties: {}
        applied:
          type: boolean
        reason:
          type:
            - string
            - "null"
      required:
        - gate
        - event
        - applied
        - reason
      additionalProperties: {}
    AgentWriteReply:
      type: object
      properties:
        event:
          type: object
          properties:
            id:
              type: string
            hlc:
              type: string
            dev:
              type: string
            type:
              type: string
            data:
              type: object
              propertyNames:
                type: string
              additionalProperties: {}
          required:
            - id
            - hlc
            - dev
            - type
            - data
          additionalProperties: {}
        buffered:
          type: boolean
        path:
          default: null
          type:
            - string
            - "null"
      required:
        - event
        - buffered
        - path
      additionalProperties: {}
    PermissionReply:
      type: object
      properties:
        decision:
          oneOf:
            - type: object
              properties:
                behavior:
                  type: string
                  const: allow
              required:
                - behavior
              additionalProperties: {}
            - type: object
              properties:
                behavior:
                  type: string
                  const: deny
                message:
                  type: string
                interrupt:
                  type: boolean
              required:
                - behavior
                - message
                - interrupt
              additionalProperties: {}
        gate:
          type:
            - string
            - "null"
      required:
        - decision
        - gate
      additionalProperties: {}
    Session:
      type: object
      properties:
        id:
          type: string
        workspace:
          type: string
        task:
          type: string
        key:
          type:
            - string
            - "null"
        agent:
          type: string
        host:
          default: tmux
          type: string
        epoch:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        state:
          type: string
        cwd:
          type: string
        window:
          type:
            - string
            - "null"
        pid:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        resumes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
        - id
        - workspace
        - task
        - key
        - agent
        - host
        - epoch
        - state
        - cwd
        - window
        - pid
        - resumes
      additionalProperties: {}
    LoopReply:
      type: object
      properties:
        next:
          type: string
        gate:
          type:
            - string
            - "null"
        gates:
          type: array
          items:
            type: string
        event:
          anyOf:
            - type: object
              properties:
                id:
                  type: string
                hlc:
                  type: string
                dev:
                  type: string
                type:
                  type: string
                data:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
              required:
                - id
                - hlc
                - dev
                - type
                - data
              additionalProperties: {}
            - type: "null"
        applied:
          type: boolean
        reason:
          type:
            - string
            - "null"
      required:
        - next
      additionalProperties: {}
    SubtaskReply:
      type: object
      properties:
        next:
          type: string
        event:
          type: object
          properties:
            id:
              type: string
            hlc:
              type: string
            dev:
              type: string
            type:
              type: string
            data:
              type: object
              propertyNames:
                type: string
              additionalProperties: {}
          required:
            - id
            - hlc
            - dev
            - type
            - data
          additionalProperties: {}
        applied:
          type: boolean
        reason:
          type:
            - string
            - "null"
        task:
          type: object
          properties:
            id:
              type: string
            key:
              type:
                - string
                - "null"
          required:
            - id
            - key
          additionalProperties: {}
      required:
        - next
        - event
        - applied
        - reason
        - task
      additionalProperties: {}
    SlotAcquireReply:
      type: object
      properties:
        lease:
          anyOf:
            - type: object
              properties:
                resource:
                  type: string
                slot:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                fencing_token:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                ttl_ms:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                expires_at:
                  type: string
              required:
                - resource
                - slot
                - fencing_token
                - ttl_ms
                - expires_at
              additionalProperties: {}
            - type: "null"
        renewed:
          type: boolean
        queued:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        next:
          type: string
      required:
        - lease
        - renewed
        - queued
        - next
      additionalProperties: {}
    SlotReleaseReply:
      type: object
      properties:
        released:
          type: object
          properties:
            resource:
              type: string
            slot:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            fencing_token:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            ttl_ms:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            expires_at:
              type: string
          required:
            - resource
            - slot
            - fencing_token
            - ttl_ms
            - expires_at
          additionalProperties: {}
        next:
          type: string
      required:
        - released
        - next
      additionalProperties: {}
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: A stable error code, for example `invalid_input` or `not_found`
            message:
              type: string
            details: {}
          required:
            - code
            - message
          additionalProperties: false
        trace_id:
          type: string
      required:
        - error
        - trace_id
      additionalProperties: false
    Answer:
      type: object
      properties:
        event:
          type: string
        dev:
          type: string
        hlc:
          type: string
        by:
          type:
            - string
            - "null"
        version:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        answer:
          type: string
        comment:
          type:
            - string
            - "null"
        use:
          type: string
          enum:
            - pending
            - used
            - comment
      required:
        - event
        - dev
        - hlc
        - by
        - version
        - answer
        - comment
        - use
      additionalProperties: {}
    Gate:
      type: object
      properties:
        gate:
          type: string
        kind:
          type: string
        version:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        title:
          type: string
        options:
          type: array
          items:
            type: string
        file:
          type:
            - string
            - "null"
        state:
          type: string
          enum:
            - open
            - resolved
        answer:
          type:
            - string
            - "null"
        answer_event:
          type:
            - string
            - "null"
        resolved_by:
          type:
            - string
            - "null"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"
      required:
        - gate
        - kind
        - version
        - title
        - options
        - file
        - state
        - answer
        - answer_event
        - resolved_by
        - answers
      additionalProperties: {}
    TaskRef:
      type: object
      properties:
        id:
          type: string
        key:
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
      required:
        - id
        - key
        - title
      additionalProperties: {}
    GateEntry:
      type: object
      properties:
        gate:
          type: string
        kind:
          type: string
        version:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        title:
          type: string
        options:
          type: array
          items:
            type: string
        file:
          type:
            - string
            - "null"
        state:
          type: string
          enum:
            - open
            - resolved
        answer:
          type:
            - string
            - "null"
        answer_event:
          type:
            - string
            - "null"
        resolved_by:
          type:
            - string
            - "null"
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"
        task:
          $ref: "#/components/schemas/TaskRef"
      required:
        - gate
        - kind
        - version
        - title
        - options
        - file
        - state
        - answer
        - answer_event
        - resolved_by
        - answers
        - task
      additionalProperties: {}
    Task:
      type: object
      properties:
        id:
          type: string
        key:
          type:
            - string
            - "null"
        key_state:
          type: string
          enum:
            - ok
            - duplicate
        project:
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
        first_message:
          type:
            - string
            - "null"
        priority:
          type:
            - string
            - "null"
        stage:
          type: string
          enum:
            - backlog
            - discuss
            - ready
            - implement
            - review
            - done
        needs_you:
          type: array
          items:
            type: string
        needs_you_reasons:
          type: array
          items:
            type: object
            properties:
              reason:
                type: string
            required:
              - reason
            additionalProperties: {}
        needs_you_lane:
          type: boolean
        assignee:
          type:
            - string
            - "null"
        owner:
          type:
            - string
            - "null"
        parent:
          type:
            - string
            - "null"
        subtasks:
          type: array
          items:
            type: string
        depends_on:
          type: array
          items:
            type: string
        archived:
          type: boolean
        gates:
          type: array
          items:
            $ref: "#/components/schemas/Gate"
        last_hlc:
          type:
            - string
            - "null"
      required:
        - id
        - key
        - key_state
        - project
        - title
        - first_message
        - priority
        - stage
        - needs_you
        - needs_you_reasons
        - needs_you_lane
        - assignee
        - owner
        - parent
        - subtasks
        - depends_on
        - archived
        - gates
        - last_hlc
      additionalProperties: {}
    Event:
      type: object
      properties:
        v:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        id:
          type: string
        hlc:
          type: string
        dev:
          type: string
        type:
          type: string
        task:
          type: string
        by:
          type: string
        data:
          type: object
          propertyNames:
            type: string
          additionalProperties: {}
      required:
        - v
        - id
        - hlc
        - dev
        - type
        - data
      additionalProperties: {}
    EventRow:
      type: object
      properties:
        id:
          type: string
        task:
          type:
            - string
            - "null"
        hlc:
          type: string
        dev:
          type: string
        type:
          type: string
        path:
          type: string
        line:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        applied:
          type: boolean
        reason:
          type:
            - string
            - "null"
        event:
          $ref: "#/components/schemas/Event"
      required:
        - id
        - task
        - hlc
        - dev
        - type
        - path
        - line
        - applied
        - reason
        - event
      additionalProperties: {}
    WriteResult:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/Event"
        applied:
          type: boolean
          description: False when the merge did not apply the event; see `reason`
        reason:
          type:
            - string
            - "null"
      required:
        - event
        - applied
        - reason
      additionalProperties: {}
    Project:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        devices:
          type: array
          items:
            type: string
        default_agent:
          type: string
        test_servers:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            type: string
        main_repo:
          type:
            - string
            - "null"
        switches:
          type: object
          properties:
            assign_new_subtasks_to_default_device:
              type: boolean
          additionalProperties: {}
        archived:
          type: boolean
        tasks:
          type: array
          items:
            type: string
      required:
        - slug
        - name
        - devices
        - default_agent
        - test_servers
        - links
        - tasks
      additionalProperties: {}
    WorkspaceSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type:
            - string
            - "null"
        path:
          type: string
        ready:
          type: boolean
        error:
          type:
            - string
            - "null"
        tasks:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        open_gates:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        issues:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        notices:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - truncated
                  - replaced
                  - removed
              path:
                type: string
              at:
                type: string
            required:
              - code
              - path
              - at
            additionalProperties: {}
        last_hlc:
          type:
            - string
            - "null"
        new_project_permission_mode:
          anyOf:
            - type: string
              enum:
                - default
                - accept_edits
                - skip
            - type: "null"
      required:
        - id
        - name
        - path
        - ready
        - error
        - tasks
        - open_gates
        - issues
        - notices
        - last_hlc
      additionalProperties: {}
    Issue:
      type: object
      properties:
        code:
          type: string
        path:
          type: string
        line:
          anyOf:
            - type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
            - type: "null"
        event:
          type:
            - string
            - "null"
        task:
          type:
            - string
            - "null"
        reason:
          type:
            - string
            - "null"
        message:
          type: string
      required:
        - code
        - path
        - line
        - event
        - task
        - reason
        - message
      additionalProperties: {}
    Status:
      type: object
      properties:
        version:
          type: string
        device:
          type: object
          properties:
            slug:
              type: string
            name:
              type: string
            role:
              type: string
              enum:
                - local
                - remote
                - mobile
          required:
            - slug
            - name
            - role
          additionalProperties: {}
        pid:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        started_at:
          type: string
        uptime_s:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        socket:
          type: string
        ready:
          type: boolean
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceSummary"
      required:
        - version
        - device
        - pid
        - started_at
        - uptime_s
        - socket
        - ready
        - workspaces
      additionalProperties: {}
    SyncEngineState:
      type: string
      enum:
        - not_configured
        - not_installed
        - starting
        - running
        - restarting
        - stopped
        - failed
    Ready:
      type: object
      properties:
        ready:
          type: boolean
        checks:
          type: object
          properties:
            workspaces:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  ready:
                    type: boolean
                  error:
                    type:
                      - string
                      - "null"
                required:
                  - id
                  - ready
                  - error
                additionalProperties: false
            sync_engine:
              $ref: "#/components/schemas/SyncEngineState"
            session_host:
              type: string
              enum:
                - ok
                - failed
                - not_configured
            session_agent:
              type: string
              enum:
                - ok
                - failed
                - not_configured
          required:
            - workspaces
            - sync_engine
            - session_host
            - session_agent
          additionalProperties: false
      required:
        - ready
        - checks
      additionalProperties: false
    Version:
      type: object
      properties:
        version:
          type: string
        api:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        node:
          type: string
      required:
        - version
        - api
        - node
      additionalProperties: false
    ThreadPage:
      type: object
      properties:
        task:
          $ref: "#/components/schemas/TaskRef"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventRow"
        next:
          type:
            - string
            - "null"
        prev:
          description: "The cursor of the first event when older events exist: pass it as
            `before`"
          type:
            - string
            - "null"
      required:
        - task
        - events
        - next
        - prev
      additionalProperties: false
    SyncPeerStatus:
      type: object
      properties:
        device:
          type: string
        connected:
          type: boolean
        route:
          type: string
          enum:
            - lan
            - tailscale
            - relay
            - internet
            - storage
        needItems:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        needBytes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        inSync:
          type: boolean
        lastSeen:
          type: string
        lastSynced:
          type: string
        role:
          type: string
          enum:
            - local
            - remote
            - mobile
        folders:
          type: array
          items:
            type: object
            properties:
              folder:
                type: string
              workspace:
                type: string
              kind:
                type: string
                enum:
                  - tasks
                  - knowledge
                  - secure
              needItems:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              needBytes:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              remoteState:
                type: string
              inSync:
                type: boolean
            required:
              - folder
              - workspace
              - kind
              - needItems
              - needBytes
              - remoteState
              - inSync
            additionalProperties: {}
        text:
          type: string
