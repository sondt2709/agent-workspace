        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/TaskRef"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventRow"
                  next:
                    type:
                      - string
                      - "null"
                  prev:
                    description: "The cursor of the first event when older events exist: pass it as
                      `before`"
                    type:
                      - string
                      - "null"
                  ancestors:
                    type: array
                    items:
                      $ref: "#/components/schemas/ThreadPage"
                    description: The threads of the parents, oldest first
                required:
                  - task
                  - events
                  - next
                  - prev
                  - ancestors
                additionalProperties: false
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
