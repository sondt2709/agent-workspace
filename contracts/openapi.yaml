    post:
      operationId: initWorkspace
      summary: Initialize a workspace folder, or register a folder that has
        tasks/workspace.yaml
      tags:
        - workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  description: The absolute path of the workspace folder itself. Leave it out to
                    use a location (parent).
                  type: string
                  minLength: 1
                parent:
                  description: "The absolute location that holds the workspace folder:
                    <parent>/<name>, or <name>-aw1 when that name is in use.
                    With no path and no parent: ~/AW, with the name Personal by
                    default."
                  type: string
                  minLength: 1
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                key_prefix:
                  type: string
                  pattern: ^[A-Z][A-Z0-9]{0,9}$
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: boolean
                  workspace:
                    $ref: "#/components/schemas/WorkspaceSummary"
                  folder_note:
                    default: null
                    description: One sentence when the folder rule skipped a taken name, else null
                    type:
                      - string
                      - "null"
                required:
                  - created
                  - workspace
                  - folder_note
                additionalProperties: false
