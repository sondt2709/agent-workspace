# Exact versions (docs/engineering-rules.md 4.1 and 4.12): the newest release that is at least
# 7 days old on the install date. Rows and reasons: docs/tech-stack.md 1.5, 2.5 and 2.6.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"
kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
kotaml = "0.113.0"
room3 = "3.0.3"
sqlite = "2.7.1"
ktor = "3.6.1"
kermit = "2.2.0"
androidx-core = "1.19.1"
compose-bom = "2026.11.01"
activity-compose = "1.13.0"
material3-adaptive = "1.3.0"
navigation3 = "1.2.2"
lifecycle = "2.11.1"
unifiedpush-connector = "3.3.5"
unifiedpush-fcm = "3.1.0"
tink = "1.24.0"
code-scanner = "16.1.0"
markdown-renderer = "0.46.0"
# Screenshot and Compose tests of android/app on the JVM (openspec phone-desktop-parity).
roborazzi = "1.79.0"
robolectric = "4.18.1"
junit4 = "4.13.2"
spotless = "8.9.0"
ktlint = "1.8.0"
detekt = "2.0.0-alpha.6"
android-compile-sdk = "37"
# Compose 1.13 (BOM 2026.11.01) needs the minor API level 37.1 in the app that depends on it.
android-compile-minor = "1"
android-min-sdk = "29"
android-target-sdk = "37"
jdk = "21"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotaml = { module = "io.heapy.kotaml:kotaml", version.ref = "kotaml" }
room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "material3-adaptive" }
adaptive-layout = { module = "androidx.compose.material3.adaptive:adaptive-layout", version.ref = "material3-adaptive" }
adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "material3-adaptive" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush-connector" }
unifiedpush-fcm = { module = "org.unifiedpush.android:embedded-fcm-distributor", version.ref = "unifiedpush-fcm" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "code-scanner" }
markdown-renderer-m3 = { module = "com.mikepenz:multiplatform-markdown-renderer-m3", version.ref = "markdown-renderer" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
