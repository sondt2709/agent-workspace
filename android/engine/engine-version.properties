# The pins of the Android sync engine libawsync.so (docs/tech-stack.md 1.2, docs/phase-1.md 6.7).
# One key=value per line, no quotes: scripts/build-libawsync.sh reads it with ". file", Gradle with
# java.util.Properties. The tag is the tag of plugins/sync-syncthing/engine/engine.json (a JVM test
# checks it). The release tarball has the vendored Go modules and a RELEASE file, so the build needs
# no git and no module download.
SYNCTHING_TAG=v2.1.7
SYNCTHING_SOURCE_URL=https://github.com/syncthing/syncthing/releases/download/v2.1.7/syncthing-source-v2.1.7.tar.gz
SYNCTHING_SOURCE_SHA256=5b84abd0e8b187f618fb2c38c37fa37ce0b377a275d3e0b981bad94176a24afa
# The build time in the binary (SOURCE_DATE_EPOCH): the time of the RELEASE file in the tarball.
# A fixed value makes the build reproducible; with no git, build.go would use the current time.
SYNCTHING_SOURCE_DATE_EPOCH=1792562154
# Go of the recipe of researchxxl/syncthing-android (docs/feasibility-details.md AN2), from go.dev/dl.
GO_VERSION=1.27.4
GO_SHA256_LINUX_AMD64=7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840
GO_SHA256_LINUX_ARM64=3392582988a273a87ab5043ee1b2c9c17a2c3c00580bf9326c47a2e0aaaeac92
GO_SHA256_DARWIN_AMD64=2b799377704ef12db39bd254995d5c348c9cc8d86562ca817724390e56c38f43
GO_SHA256_DARWIN_ARM64=91a44a2b8a716600ad94a4f143e156116620db8828086a6e3602291be9bd0bb4
# The NDK of the SDK package ndk;<version> (sdkmanager checks its archive). The script reads
# Pkg.Revision of <ndk>/source.properties.
NDK_VERSION=30.0.16248370
# The API level of the clang target (<triple><api>-clang): the minSdk of the app.
ANDROID_API=29
# The sha256 of each built file (reproducible build: the same value from each build of these pins;
# recorded from 2 builds with clean Go caches on a macOS arm64 host). An empty value: the script prints
# the sha256 to record here.
LIBAWSYNC_SHA256_ARM64_V8A=7b1a45ece92dab99426384d48a4f6e68d50088ab8c9496e46e0b73a615740d8c
LIBAWSYNC_SHA256_X86_64=d9c025e6d7a2d04ee9ea5b0f906884035b4277e3525ec78446b3ce9e4135daa7
