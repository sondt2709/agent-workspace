# detekt rules for the Compose code of :app, on top of android/detekt.yaml. A composable function is
# named like a type (Compose API guidelines), takes many parameters (state and callbacks) and is
# read as a layout tree, so these defaults do not fit it.
naming:
  FunctionNaming:
    ignoreAnnotated: ["Composable"]
complexity:
  LongParameterList:
    ignoreAnnotated: ["Composable"]
  LongMethod:
    ignoreAnnotated: ["Composable"]
  CyclomaticComplexMethod:
    ignoreAnnotated: ["Composable"]
# One button style (openspec phone-desktop-parity): the screens use the buttons of Compact.kt (36 dp
# visible, a 48 dp touch target), never the Material 3 buttons directly.
style:
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: "androidx.compose.material3.Button"
        reason: "Use Button of Compact.kt: one button style of 36 dp."
      - value: "androidx.compose.material3.OutlinedButton"
        reason: "Use OutlinedButton of Compact.kt: one button style of 36 dp."
      - value: "androidx.compose.material3.TextButton"
        reason: "Use TextButton of Compact.kt: one button style of 36 dp."
      - value: "androidx.compose.material3.FilledTonalButton"
        reason: "Use a button of Compact.kt: one button style of 36 dp."
      - value: "androidx.compose.material3.ElevatedButton"
        reason: "Use a button of Compact.kt: one button style of 36 dp."
